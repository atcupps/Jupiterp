<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Core SaaS API -->
    <link rel="preconnect" href="https://api.jupiterp.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.jupiterp.com" />

    <!-- Google Fonts Assets for Cabin -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />

    %sveltekit.head%

    <script>
      if (
        localStorage.theme === 'dark' ||
        (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
      if (localStorage.font === 'minecraft') {
        document.documentElement.classList.add('minecraft');
      }
    </script>
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
